name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile checks
        run: |
          python -m py_compile taskLogger.py taskListGUI.py taskLoggerGUI.py

      - name: Core logic smoke check
        run: |
          python - <<'PY'
          import os
          import tempfile
          import taskLogger

          fd, path = tempfile.mkstemp(suffix=".xlsx")
          os.close(fd)
          os.remove(path)

          result = taskLogger.add_task_to_log(
              task_name="CI smoke task",
              start_date="2026-01-01",
              start_time="09:00",
              start_period="AM",
              end_date="2026-01-01",
              end_time="10:30",
              end_period="AM",
              timezone="UTC",
              task_log=path,
              attendees=["ci@example.com"],
              sync_to_google=False,
          )
          assert result["task_id"]

          loaded = taskLogger.load_task_log(path)
          assert len(loaded) == 1

          update = taskLogger.update_task_in_log(
              task_id=result["task_id"],
              task_name="CI smoke task updated",
              start_date="2026-01-01",
              start_time="09:00",
              start_period="AM",
              end_date="2026-01-01",
              end_time="11:00",
              end_period="AM",
              timezone="UTC",
              task_log=path,
              attendees="ci@example.com",
              sync_to_google=False,
          )
          assert update["task_id"] == result["task_id"]

          taskLogger.remove_task_from_log(
              task_id=result["task_id"],
              task_log=path,
              sync_to_google=False,
          )
          loaded = taskLogger.load_task_log(path)
          assert len(loaded) == 0

          os.remove(path)
          PY
